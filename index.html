<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستبيان الوطني الموحد – مراقبة التربية والتعليم ببلدية سلوق</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>
document.documentElement.dataset.view = location.hash === '#admin' ? 'admin' : 'survey';
try {
  var savedTheme = localStorage.getItem('tg_t') || 'l';
  document.documentElement.dataset.t = savedTheme;
  var savedFont = parseFloat(localStorage.getItem('tg_f'));
  if (savedFont) document.documentElement.style.fontSize = savedFont + 'px';
} catch (e) {}
</script>
<style>
:root {
  --bg: #f0f4f9;
  --bg-soft: #e6eef8;
  --card: #ffffff;
  --tx: #0f1e36;
  --mut: #475872;
  --pr: #0b4f94;
  --pr-dark: #073566;
  --pr-light: #e6f0fa;
  --gold: #b5852b;
  --gold-light: #fdf6e7;
  --bd: #c5d3e6;
  --ok: #0b7a43;
  --ok-bg: #e7f6ee;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --er: #be1e2d;
  --er-bg: #fdebec;
  --sh: 0 6px 24px rgba(11, 79, 148, 0.08);
  --rad: 18px;
}
:root[data-t="d"] {
  --bg: #0b1320;
  --bg-soft: #131f33;
  --card: #162236;
  --tx: #f0f5fc;
  --mut: #a3b6cf;
  --pr: #58a6ff;
  --pr-dark: #79b8ff;
  --pr-light: #1c3252;
  --gold: #eab308;
  --gold-light: #2d2612;
  --bd: #2c405e;
  --ok: #34d399;
  --ok-bg: #0f2e26;
  --warn: #fbbf24;
  --warn-bg: #33270f;
  --er: #f87171;
  --er-bg: #38161b;
  --sh: 0 8px 28px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Cairo', 'Tajawal', Tahoma, sans-serif;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

/* ====== الترويسة العلوية المبسطة والواضحة ====== */
.top-header {
  background: var(--card);
  border-bottom: 3px solid var(--pr);
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: 0 2px 14px rgba(0,0,0,0.06);
}
.header-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.brand-box {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.brand-box img {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  background: #fff;
  object-fit: contain;
  flex-shrink: 0;
}
.brand-txt h1 {
  font-size: 0.95rem;
  font-weight: 800;
  margin: 0;
  color: var(--pr);
  line-height: 1.35;
}
.brand-txt p {
  margin: 0;
  font-size: 0.78rem;
  color: var(--mut);
  font-weight: 700;
}
.header-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.tool-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 6px 13px;
  border-radius: 12px;
  border: 2px solid var(--bd);
  background: var(--bg);
  color: var(--tx);
  font: 800 0.82rem 'Cairo', sans-serif;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tool-btn:hover {
  border-color: var(--pr);
  background: var(--pr-light);
}
.tool-btn.admin-switch {
  background: var(--gold-light);
  border-color: var(--gold);
  color: var(--tx);
}

/* ====== شريط التقدم والخطوات الواضح لكبار السن ====== */
.progress-wrap {
  background: var(--bg-soft);
  border-bottom: 1px solid var(--bd);
  padding: 8px 16px;
}
.progress-inner {
  max-width: 860px;
  margin: 0 auto;
}
.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--pr);
  margin-bottom: 6px;
}
.progress-track {
  height: 12px;
  background: var(--bd);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ok), var(--pr));
  width: 0%;
  transition: width 0.35s ease;
  border-radius: 99px;
}
.stepper-pills {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 0 2px;
  scrollbar-width: thin;
}
.step-pill {
  flex: 0 0 auto;
  padding: 5px 11px;
  border-radius: 99px;
  font: 700 0.72rem 'Cairo', sans-serif;
  border: 1.5px solid var(--bd);
  background: var(--card);
  color: var(--mut);
  cursor: pointer;
  transition: 0.2s;
}
.step-pill.active {
  background: var(--pr);
  color: #fff;
  border-color: var(--pr);
}
.step-pill.done {
  background: var(--ok-bg);
  color: var(--ok);
  border-color: var(--ok);
}

/* ====== الحاوية الرئيسية والبطاقات ====== */
main {
  max-width: 860px;
  margin: 0 auto;
  padding: 18px 14px 48px;
}
main.admin-wide {
  max-width: 1240px;
}
.card {
  background: var(--card);
  border: 2px solid var(--bd);
  border-radius: var(--rad);
  padding: 22px 20px;
  margin-bottom: 18px;
  box-shadow: var(--sh);
}
.hero-card {
  text-align: center;
  background: linear-gradient(180deg, var(--pr-light) 0%, var(--card) 100%);
  border-color: var(--pr);
  padding: 28px 20px;
}
.hero-card img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 4px solid var(--gold);
  background: #fff;
  padding: 4px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.14);
}
.badge-official {
  display: inline-block;
  background: var(--gold-light);
  color: var(--tx);
  border: 1.5px solid var(--gold);
  padding: 4px 16px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-weight: 800;
  margin-top: 10px;
}
.section-banner {
  background: var(--pr);
  color: #fff;
  padding: 16px 20px;
  border-radius: 14px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.section-banner h2 {
  margin: 0;
  font-size: 1.18rem;
  color: #fff;
}
.section-banner span {
  background: rgba(255,255,255,0.2);
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 0.8rem;
  font-weight: 700;
}
.helper-box {
  background: var(--gold-light);
  border: 2px solid var(--gold);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 18px;
  font-size: 0.9rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ====== تصميم الأسئلة والقوائم المنسدلة المريحة لكبار السن ====== */
.q-card {
  background: var(--bg);
  border: 2px solid var(--bd);
  border-radius: 16px;
  padding: 18px;
  margin: 18px 0;
  transition: border-color 0.25s, background-color 0.25s;
}
.q-card.answered {
  border-color: var(--ok);
  background: var(--card);
}
.q-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.q-title {
  font-size: 1.02rem;
  font-weight: 800;
  color: var(--tx);
  margin: 0;
  line-height: 1.6;
}
.q-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  height: 34px;
  padding: 0 8px;
  background: var(--pr);
  color: #fff;
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.88rem;
  margin-left: 8px;
  flex-shrink: 0;
}
.q-status {
  font-size: 0.78rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 99px;
  white-space: nowrap;
  background: var(--bg-soft);
  color: var(--mut);
  border: 1px solid var(--bd);
}
.q-card.answered .q-status {
  background: var(--ok-bg);
  color: var(--ok);
  border-color: var(--ok);
}

/* القوائم المنسدلة الكبيرة والواضحة */
.select-wrap {
  position: relative;
  margin-top: 8px;
}
.select-slot-label {
  display: block;
  font-size: 0.86rem;
  font-weight: 800;
  color: var(--pr);
  margin: 10px 0 4px;
}
select.big-select,
input[type="text"].big-input,
input[type="password"].big-input,
textarea.big-input {
  width: 100%;
  font: 700 1rem 'Cairo', sans-serif;
  padding: 14px 16px;
  min-height: 58px;
  border: 2.5px solid var(--bd);
  border-radius: 14px;
  background: var(--card);
  color: var(--tx);
  transition: all 0.2s ease;
  cursor: pointer;
}
input[type="text"].big-input,
input[type="password"].big-input,
textarea.big-input {
  cursor: text;
}
select.big-select {
  appearance: none;
  -webkit-appearance: none;
  padding-left: 46px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%230b4f94' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
  background-repeat: no-repeat;
  background-position: left 14px center;
  background-size: 22px;
}
:root[data-t="d"] select.big-select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
}
select.big-select:focus,
input.big-input:focus,
textarea.big-input:focus {
  outline: none;
  border-color: var(--pr);
  box-shadow: 0 0 0 4px rgba(11, 79, 148, 0.15);
}
select.big-select.has-val {
  border-color: var(--ok);
  background-color: var(--ok-bg);
}
textarea.big-input {
  min-height: 100px;
  resize: vertical;
}
.sub-other-box {
  margin-top: 10px;
  padding: 12px;
  background: var(--pr-light);
  border-radius: 12px;
  border: 1.5px dashed var(--pr);
}
.rating-preview-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  padding: 5px 14px;
  border-radius: 99px;
  font-weight: 800;
  font-size: 0.85rem;
}

/* أزرار التنقل السفلي */
.nav-bar {
  display: flex;
  gap: 12px;
  margin-top: 22px;
  flex-wrap: wrap;
}
.btn-primary, .btn-secondary, .btn-success, .btn-gold {
  flex: 1 1 180px;
  min-height: 58px;
  font: 800 1.05rem 'Cairo', sans-serif;
  padding: 12px 20px;
  border-radius: 14px;
  border: 2.5px solid var(--pr);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--pr);
  color: #fff;
}
.btn-primary:hover {
  background: var(--pr-dark);
}
.btn-secondary {
  background: var(--card);
  color: var(--pr);
}
.btn-secondary:hover {
  background: var(--pr-light);
}
.btn-success {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}
.btn-gold {
  background: var(--gold);
  border-color: var(--gold);
  color: #fff;
}
.err-box {
  background: var(--er-bg);
  color: var(--er);
  border: 2px solid var(--er);
  padding: 12px 16px;
  border-radius: 12px;
  font-weight: 800;
  margin-top: 14px;
  display: none;
}
.err-box.show {
  display: block;
}
#toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f1e36;
  color: #fff;
  padding: 12px 22px;
  border-radius: 14px;
  font-weight: 800;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  display: none;
  z-index: 99;
  border: 2px solid var(--gold);
}

/* ====== لوحة الإدارة والإنفوجرافيك التفاعلي ====== */
.admin-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.admin-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0;
  border-bottom: 2px solid var(--bd);
  padding-bottom: 12px;
}
.tab-btn {
  padding: 10px 18px;
  border-radius: 12px;
  border: 2px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  font: 800 0.88rem 'Cairo', sans-serif;
  cursor: pointer;
  transition: 0.2s;
}
.tab-btn.active {
  background: var(--pr);
  color: #fff;
  border-color: var(--pr);
}
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 14px;
  margin: 16px 0;
}
.kpi-card {
  background: var(--card);
  border: 2px solid var(--bd);
  border-top: 5px solid var(--pr);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--sh);
  position: relative;
}
.kpi-card.gold { border-top-color: var(--gold); }
.kpi-card.ok { border-top-color: var(--ok); }
.kpi-card.er { border-top-color: var(--er); }
.kpi-val {
  font-size: 1.75rem;
  font-weight: 900;
  color: var(--pr);
  line-height: 1.2;
}
.kpi-card.gold .kpi-val { color: var(--gold); }
.kpi-card.ok .kpi-val { color: var(--ok); }
.kpi-card.er .kpi-val { color: var(--er); }
.kpi-lbl {
  font-size: 0.84rem;
  font-weight: 800;
  color: var(--mut);
  margin-top: 4px;
}
.kpi-sub {
  font-size: 0.76rem;
  color: var(--tx);
  margin-top: 6px;
  font-weight: 700;
  background: var(--bg);
  padding: 4px 8px;
  border-radius: 8px;
}

.infographic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr));
  gap: 16px;
  margin: 16px 0;
}
.info-box {
  background: var(--card);
  border: 2px solid var(--bd);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--sh);
}
.info-box h3 {
  margin: 0 0 14px;
  font-size: 1rem;
  color: var(--pr);
  border-bottom: 2px solid var(--bg-soft);
  padding-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.bar-row {
  margin: 10px 0;
}
.bar-head {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 4px;
  gap: 8px;
}
.bar-track {
  height: 22px;
  background: var(--bg-soft);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  border: 1px solid var(--bd);
}
.bar-fill {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 0.7rem;
  font-weight: 800;
  transition: width 0.4s ease;
}

/* جدول البيانات التفاعلي */
.table-wrap {
  overflow: auto;
  max-height: 68vh;
  border: 2px solid var(--bd);
  border-radius: 14px;
  background: var(--card);
}
table.data-tbl {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.75rem;
}
table.data-tbl th,
table.data-tbl td {
  border: 1px solid var(--bd);
  padding: 8px 10px;
  vertical-align: top;
  text-align: right;
}
table.data-tbl th {
  background: var(--pr-light);
  color: var(--tx);
  position: sticky;
  top: 0;
  z-index: 5;
  font-weight: 800;
}
.fl-input {
  width: 100%;
  font: 600 0.72rem 'Cairo', sans-serif;
  padding: 5px 7px;
  margin-top: 4px;
  border: 1px solid var(--bd);
  border-radius: 6px;
  background: var(--card);
  color: var(--tx);
}

/* ====== مركز إعداد ومعاينة الطباعة الرسمية ====== */
.print-config-panel {
  background: linear-gradient(135deg, var(--pr-light), var(--card));
  border: 2px solid var(--pr);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
}
.print-sheets-selector {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 10px;
  margin: 14px 0;
}
.sheet-card-btn {
  text-align: right;
  padding: 14px;
  border-radius: 12px;
  border: 2px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  cursor: pointer;
  font-family: inherit;
  transition: 0.2s;
}
.sheet-card-btn:hover {
  border-color: var(--pr);
}
.sheet-card-btn.active {
  border-color: var(--pr);
  background: var(--pr);
  color: #fff;
}
.sheet-card-btn b {
  display: block;
  font-size: 0.88rem;
  margin-bottom: 4px;
}
.sheet-card-btn small {
  font-size: 0.74rem;
  opacity: 0.88;
  line-height: 1.4;
  display: block;
}

/* ====== تصميم الكشوفات الطباعية الرسمية (معاينة + طباعة حقيقية 100%) ====== */
#official-print-area {
  background: #ffffff;
  color: #000000;
  padding: 24px;
  border: 2px solid #222;
  border-radius: 8px;
  font-family: 'Cairo', 'Amiri', Tahoma, serif;
  direction: rtl;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}
.gov-page {
  background: #ffffff;
  color: #000000;
}
.gov-page-break {
  page-break-before: always;
  break-before: page;
  margin-top: 28px;
  padding-top: 18px;
  border-top: 2px dashed #999;
}
.gov-bsm {
  text-align: center;
  font-family: 'Amiri', serif;
  font-size: 13pt;
  font-weight: 700;
  margin-bottom: 6px;
  color: #000;
}
.gov-header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 14px;
  border-bottom: 3px double #000;
  padding-bottom: 10px;
  margin-bottom: 12px;
}
.gov-hdr-right {
  font-size: 10.5pt;
  font-weight: 800;
  line-height: 1.55;
  color: #000;
}
.gov-hdr-center {
  text-align: center;
}
.gov-hdr-center img {
  width: 82px;
  height: 82px;
  object-fit: contain;
}
.gov-hdr-left {
  border: 1.5px solid #000;
  padding: 7px 12px;
  font-size: 9pt;
  line-height: 1.6;
  background: #f8f9fa;
  color: #000;
}
.gov-title-banner {
  border: 2px solid #000;
  background: #eaeff5;
  text-align: center;
  padding: 8px 14px;
  margin-bottom: 14px;
}
.gov-title-banner h2 {
  margin: 0;
  font-size: 13.5pt;
  font-weight: 900;
  color: #000;
}
.gov-title-banner p {
  margin: 2px 0 0;
  font-size: 9.5pt;
  font-weight: 700;
  color: #222;
}
.gov-sec-head {
  background: #dfe6ee;
  border: 1.5px solid #000;
  padding: 5px 10px;
  font-size: 10.5pt;
  font-weight: 900;
  margin: 14px 0 6px;
  color: #000;
}
table.gov-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 12px;
  font-size: 8.8pt;
  color: #000;
  background: #fff;
}
table.gov-table th,
table.gov-table td {
  border: 1px solid #000;
  padding: 5px 7px;
  vertical-align: middle;
  text-align: right;
  line-height: 1.45;
  color: #000;
}
table.gov-table th {
  background: #e3e8ef;
  font-weight: 800;
  text-align: center;
}
table.gov-table tr:nth-child(even) td {
  background: #fafbfc;
}
.gov-bar-wrap {
  width: 100%;
  height: 11px;
  border: 1px solid #000;
  background: #fff;
  overflow: hidden;
}
.gov-bar-fill {
  height: 100%;
  background: #1e3a5f;
}
.gov-kpi-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.gov-kpi-cell {
  border: 1.5px solid #000;
  padding: 6px 8px;
  text-align: center;
  background: #f8f9fa;
}
.gov-kpi-cell b {
  display: block;
  font-size: 12pt;
  font-weight: 900;
  color: #000;
}
.gov-kpi-cell span {
  font-size: 8pt;
  font-weight: 700;
  color: #222;
}
.gov-signatures {
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 14px;
  margin-top: 18px;
  padding-top: 10px;
  border-top: 2px solid #000;
  page-break-inside: avoid;
  break-inside: avoid;
  font-size: 9.5pt;
  color: #000;
}
.gov-sig-box {
  border: 1px solid #000;
  padding: 8px 10px;
  min-height: 92px;
  position: relative;
}
.gov-sig-box b {
  display: block;
  margin-bottom: 4px;
  text-decoration: underline;
}
.gov-stamp-circle {
  width: 66px;
  height: 66px;
  border: 1.5px dashed #444;
  border-radius: 50%;
  position: absolute;
  left: 12px;
  bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 7pt;
  color: #444;
  text-align: center;
}
.gov-dossier {
  border: 2px solid #000;
  padding: 14px;
  margin-bottom: 18px;
  page-break-inside: avoid;
  break-inside: avoid;
  background: #fff;
}

@media screen {
  #official-print-area {
    max-inline-size: 100%;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
  }
}

@media screen and (max-width: 640px) {
  .print-sheets-selector {
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
  }
  .print-config-panel .btn-primary { max-inline-size: 100%; }
}

@media (max-width: 640px) {
  .gov-header { grid-template-columns: 1fr; text-align: center; }
  .gov-kpi-strip { grid-template-columns: repeat(2, 1fr); }
  .gov-signatures { grid-template-columns: 1fr; }
}

/* ====== إعدادات الطباعة الحقيقية (@media print) ====== */
@media print {
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    font-size: 10pt !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .top-header,
  .progress-wrap,
  .noprint,
  #toast {
    display: none !important;
  }
  main, main.admin-wide {
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  #official-print-area {
    display: block !important;
    border: 0 !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }
  .gov-page-break {
    border-top: 0 !important;
    margin-top: 0 !important;
    padding-top: 0 !important;
    page-break-before: always !important;
    break-before: page !important;
  }
  table.gov-table {
    page-break-inside: auto;
  }
  table.gov-table thead {
    display: table-header-group;
  }
  table.gov-table tfoot {
    display: table-footer-group;
  }
  table.gov-table tr {
    page-break-inside: avoid;
    break-inside: avoid;
  }
  @page {
    size: A4;
    margin: 10mm 10mm;
  }
}

function toast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
}

function fz(d) {
  const h = document.documentElement;
  const current = parseFloat(getComputedStyle(h).fontSize);
  const next = Math.min(27, Math.max(16, current + d * 2));
  h.style.fontSize = next + 'px';
  try { localStorage.setItem('tg_f', String(next)); } catch (e) {}
  toast('حجم الخط الآن: ' + next + ' بكسل');
}

function dk() {
  const h = document.documentElement;
  const next = h.dataset.t === 'd' ? 'l' : 'd';
  h.dataset.t = next;
  try { localStorage.setItem('tg_t', next); } catch (e) {}
  toast(next === 'd' ? 'تم تفعيل الوضع الليلي المريح للعين' : 'تم تفعيل الوضع النهاري الواضح');
}

function surveyLabel(name, text) {
  return `<label class="field-label" for="survey-${name}">${esc(text)}</label>`;
}

function surveySelect(name, choices, prompt, { selected = A[name], blocked = [], attributes = '' } = {}) {
  const current = String(selected ?? '');
  return `<select id="survey-${name}" name="${name}" ${attributes}>
    ${prompt ? `<option value="">${esc(prompt)}</option>` : ''}
    ${choices.map(choice => {
      const [value, label] = Array.isArray(choice) ? choice : [choice, choice];
      const disabled = blocked.includes(value) && value !== current;
      return `<option value="${esc(value)}"${current === value ? ' selected' : ''}${disabled ? ' disabled' : ''}>${esc(label)}</option>`;
    }).join('')}
  </select>`;
}

function surveyField(name, label, choices, prompt) {
  return `<div class="q">${surveyLabel(name, label)}${surveySelect(name, choices, prompt)}</div>`;
}

function writeAnswer(name, label, visible = true, multiline = false) {
  const value = esc(A[name] ?? '');
  return `<div class="write-answer" id="write-${name}"${visible ? '' : ' hidden'}>
    ${surveyLabel(name, label)}
    ${multiline
      ? `<textarea id="survey-${name}" name="${name}">${value}</textarea>`
      : `<input type="text" id="survey-${name}" name="${name}" value="${value}">`}
  </div>`;
}

function locationField(key, label, value) {
  const name = key + '_sel';
  return `<div>
    ${surveyLabel(name, label)}
    ${surveySelect(name, [value], '', { selected:value, attributes:'data-fixed-location="1"' })}
  </div>`;
}

function surveyAxisQuestion([id, max, hasOther, text, choices]) {
  const label = qn(id) + ' ' + text
    .replace(' (اختر 3 من القوائم المنسدلة)', ' (اختر 3 فقط)')
    .replace(' (اختر أهم 2 من القائمتين)', ' (اختر أهم 2)');
  const other = hasOther ? writeAnswer(id + '_o', id === 'q12' ? 'مقترحك المحدد (اختياري)' : 'إجابة أخرى (اختياري)') : '';
  if (max === 1) {
    return `<div class="q">${surveyLabel(id, label)}${surveySelect(id, choices, 'اختر الإجابة')}${other}</div>`;
  }

  const previous = String(A[id] || '').split(' | ');
  const slots = Array.from({ length:max }, (_, index) => {
    const name = id + '__s' + (index + 1);
    return { name, value:A[name] ?? previous[index] ?? '' };
  });
  const blocked = slots.map(slot => slot.value).filter(Boolean);
  return `<fieldset class="q"><legend>${esc(label)}</legend>
    ${slots.map(({ name, value }, index) => `<div class="answer-slot">
      ${surveyLabel(name, 'الاختيار ' + ORDINALS[index])}
      ${surveySelect(name, choices, 'اختر من القائمة', { selected:value, blocked, attributes:`data-multi-q="${id}"` })}
    </div>`).join('')}
    ${other}
  </fieldset>`;
}

function openAnswer(name, label, suggestions, multiline = false) {
  const choices = suggestions.filter(option => !option.startsWith('أخرى'));
  const value = A[name] || '';
  const selected = value && !choices.includes(value) ? CUSTOM_ANSWER : value;
  const selectName = name + '-choice';
  return `<div class="answer-slot">
    ${surveyLabel(selectName, label)}
    ${surveySelect(selectName, [...choices, [CUSTOM_ANSWER, 'أخرى — اكتب إجابتي']], 'اختر مقترحًا أو اكتب إجابتك', {
      selected, attributes:`data-open-target="${name}"`
    })}
    ${writeAnswer(name, 'إجابتك', Boolean(value), multiline)}
  </div>`;
}

document.addEventListener('change', event => {
  const field = event.target;
  if (location.hash === '#admin') {
    if (field.classList.contains('big-select')) field.classList.toggle('has-val', Boolean(field.value));
    return;
  }
  if (!field.closest('#app')) return;
  const { writeField, writeValue, multiQ, openTarget } = field.dataset;
  if (writeField) {
    $('#write-' + writeField).hidden = field.value !== writeValue;
  }
  if (multiQ) {
    const selects = $$(`#app select[data-multi-q="${multiQ}"]`);
    const picked = new Set(selects.map(select => select.value).filter(Boolean));
    for (const select of selects) {
      for (const option of select.options) {
        option.disabled = option.value !== select.value && picked.has(option.value);
      }
    }
  }
  if (openTarget) {
    const answer = $('#survey-' + openTarget);
    $('#write-' + openTarget).hidden = !field.value;
    if (field.value === CUSTOM_ANSWER) answer.focus();
    else answer.value = field.value;
  }
  collect();
});

function collect() {
  if (location.hash === '#admin') return;
  let edited = false;
  for (const field of $$('#app input, #app textarea, #app select')) {
    if (!field.name || field.dataset.openTarget || field.dataset.fixedLocation) continue;
    const value = field.value.trim();
    if (value !== (A[field.name] ?? '')) edited = true;
    A[field.name] = value;
  }
  for (const [key, , value] of LOCATION_FIELDS) {
    if (A[key] !== value) edited = true;
    A[key] = value;
  }
  if (edited) delete A._receipt;
  for (const [id, max] of Q) {
    if (max < 2 || !$('#survey-' + id + '__s1')) continue;
    const selected = Array.from({ length:max }, (_, index) => A[id + '__s' + (index + 1)]).filter(Boolean);
    A[id] = [...new Set(selected)].join(' | ');
  }
  saveDraft();
}

function showError(msg) {
  const e = $('#err');
  if (!e) return;
  e.textContent = '⚠️ ' + msg;
  e.classList.add('show');
  e.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function go(direction) {
  if (submitting) return;
  collect();
  if (direction > 0 && S === 1) {
    const words = (A.name || '').split(/\s+/).filter(word => word.length >= 2);
    if (words.length < 4) return showError('اكتب الاسم الرباعي من أربعة أسماء على الأقل.');
    if (!A.role) return showError('اختر صفتك من القائمة.');
    if (A.role === OTHER_ROLE && !A.role_other) return showError('اذكر صفتك عند اختيار «أخرى».');
  }
  if (direction > 0 && S === 8) return submit();
  S += direction;
  render();
}

async function surveyRequest(url, body) {
  const options = { cache: 'no-store', credentials: 'omit' };
  if (body !== undefined) {
    options.method = 'POST';
    options.body = JSON.stringify(body);
  }
  const response = await fetch(url, options);
  if (!response.ok) throw new Error('Survey request failed');
  return response;
}

async function submit() {
  if (submitting) return;
  if (!API) return showError('رابط حفظ الردود يحتاج إلى إعداد.');
  submitting = true;
  $$('#app .nav button').forEach(button => button.disabled = true);
  const d = Object.fromEntries(COLS.map(([key]) => [key, A[key] || '']));
  if (A.role === OTHER_ROLE) d.role = OTHER_ROLE + ': ' + A.role_other;
  d.region = LOCATION_FIELDS.map(([, label, value]) => label + ': ' + value).join(' | ');
  for (const [id] of Q) {
    if (A[id + '_o']) d[id] = [d[id], 'أخرى: ' + A[id + '_o']].filter(Boolean).join(' | ');
  }
  d.o1 = [A.o1a, A.o1b, A.o1c].filter(Boolean).join(' | ');
  d.o3 = [A.o3a, A.o3b, A.o3c].filter(Boolean).join(' | ');
  d.time = new Date().toLocaleString('en-GB', { timeZone: 'Africa/Tripoli' });

  try {
    if (!/^[0-9a-f]{32}$/.test(A._receipt || '')) {
      const bytes = crypto.getRandomValues(new Uint8Array(16));
      A._receipt = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
    }
    saveDraft();
    const response = await surveyRequest(API + '?receipt=' + A._receipt, d);
    const text = (await response.text()).trim();
    if (text !== 'ok' && JSON.parse(text)?.ok !== true) throw new Error('Unconfirmed save');
    try { localStorage.removeItem('tg_draft_v2'); } catch (error) {}
    A = {};
    S = 0;
    if (location.hash !== '#admin') {
      $('#bar').style.width = '100%';
      $('#app').innerHTML = `<div class="card hero"><img src="${LOGO}" alt="">
        <h2 style="color:var(--ok)">✔ تم استلام إجاباتك</h2>
        <p>شكراً لك ${esc(d.name)} على مشاركتك في رسم مستقبل التعليم في ليبيا.</p>
        <button type="button" class="b" onclick="render()">تعبئة استبيان جديد</button>
      </div>`;
      scrollTo(0, 0);
    }
  } catch {
    if (location.hash !== '#admin') showError('تعذر تأكيد حفظ الرد. إجاباتك ما زالت في النموذج ويمكنك إعادة المحاولة.');
  } finally {
    submitting = false;
    if (location.hash !== '#admin') $$('#app .nav button').forEach(button => button.disabled = false);
  }
}

async function loadRows(form, field, button) {
  if (button.disabled) return;
  if (!field.value) return showError('أدخل كلمة مرور الإدارة.');
  if (!API) return showError('رابط خدمة الردود يحتاج إلى إعداد.');
  const password = field.value;
  const stillOpen = () => form.isConnected && location.hash === '#admin';
  button.disabled = true;
  $('#err').classList.remove('show');
  try {
    const info = await (await surveyRequest(API)).json();
    if (!stillOpen()) return;
    let loaded;
    if (info?.apiVersion === 2) {
      const result = await (await surveyRequest(API, { action:'admin', password })).json();
      if (!stillOpen()) return;
      if (result?.code === 'unauthorized') return showError('كلمة المرور غير صحيحة.');
      if (result?.code === 'configuration') return showError('إعدادات الوصول إلى جدول الردود تحتاج إلى مراجعة.');
      if (result?.ok !== true) throw new Error('Login failed');
      loaded = result.rows;
    } else if (Array.isArray(info) && info.length === 0) {
      // توافق مع النسخة القديمة من الخدمة أثناء تحديث Apps Script.
      loaded = await (await surveyRequest(API + '?key=' + encodeURIComponent(password))).json();
      if (!stillOpen()) return;
      if (Array.isArray(loaded) && loaded.length === 0) {
        return showError('كلمة المرور غير صحيحة أو جدول الردود فارغ.');
      }
    } else {
      throw new Error('Unsupported service response');
    }
    if (!Array.isArray(loaded) || loaded.some(row => !row || typeof row !== 'object' || Array.isArray(row))) {
      throw new Error('Invalid survey records');
    }
    field.value = '';
    rows = loaded;
    renderAdminDashboard();
    toast('عدد الاستمارات المسجلة: ' + rows.length);
  } catch {
    if (stillOpen()) showError('تعذر جلب الردود من الخادم. أعد المحاولة.');
  } finally {
    button.disabled = false;
  }
}

function roleCategory(value) {
  const role = String(value ?? '').trim();
  if (role.startsWith(OTHER_ROLE + ':')) return OTHER_ROLE;
  return LEGACY_ROLE_NAMES.get(role) ?? role;
}

function ratingScore(value) {
  if (typeof value !== 'string' && typeof value !== 'number') return 0;
  const score = Number(value);
  return Number.isInteger(score) && score >= 1 && score <= 5 ? score : 0;
}

function flt() {
  const f = {};
  $$('.fl-input').forEach(i => {
    if (i.value.trim()) f[i.dataset.k] = i.value.trim().toLowerCase();
  });
  const g = ($('#gs')?.value || '').trim().toLowerCase();
  const roleFilter = ($('#quick-role-filter')?.value || '').trim().toLowerCase();
  const stageFilter = ($('#quick-stage-filter')?.value || '').trim().toLowerCase();

  const matches = (row, key, query) =>
    String(row[key] ?? '').toLowerCase().includes(query) ||
    (key === 'role' && roleCategory(row[key]).toLowerCase().includes(query));

  return rows.filter(r => {
    if (roleFilter && !matches(r, 'role', roleFilter)) return false;
    if (stageFilter && !matches(r, 'stage', stageFilter)) return false;
    return Object.keys(f).every(k => matches(r, k, f[k])) &&
      (!g || COLS.some(([k]) => matches(r, k, g)));
  });
}

// حساب كافة الإحصاءات والإنفوجرافيك من المصفوفة المفلترة
function computeAnalytics(v) {
  const total = v.length;
  const domainStats = R.map((t, i) => {
    const k = 'r' + (i + 1);
    const c = [0, 0, 0, 0, 0, 0];
    v.forEach(r => {
      const score = ratingScore(r[k]);
      if (score) c[score]++;
    });
    const m = c[1] + c[2] + c[3] + c[4] + c[5];
    const avg = m ? (c[1] + 2 * c[2] + 3 * c[3] + 4 * c[4] + 5 * c[5]) / m : 0;
    const pct = (avg / 5) * 100;
    const posPct = m ? ((c[4] + c[5]) / m) * 100 : 0;
    const negPct = m ? ((c[1] + c[2]) / m) * 100 : 0;
    let grade = 'غير مقيم';
    if (m) {
      if (avg >= 4.2) grade = 'ممتاز';
      else if (avg >= 3.4) grade = 'جيد';
      else if (avg >= 2.6) grade = 'مقبول';
      else if (avg >= 1.8) grade = 'ضعيف';
      else grade = 'ضعيف جدًا';
    }
    return { idx: i + 1, key: k, t, c, m, a: avg, pct, posPct, negPct, grade };
  });

  const validDomains = domainStats.filter(d => d.m > 0);
  const overallAvg = validDomains.length
    ? validDomains.reduce((acc, x) => acc + x.a, 0) / validDomains.length
    : 0;
  const hiDomain = validDomains.length
    ? validDomains.reduce((a, b) => (b.a > a.a ? b : a))
    : null;
  const loDomain = validDomains.length
    ? validDomains.reduce((a, b) => (b.a < a.a ? b : a))
    : null;

  // توزيع الصفة، المرحلة، النوع، الخبرة، المشاركة السابقة
  const countBy = (list, extractor) => {
    const map = new Map(list.map(item => [item, 0]));
    v.forEach(r => {
      const val = extractor(r);
      if (!val) return;
      map.set(val, (map.get(val) || 0) + 1);
    });
    return [...map.entries()].map(([name, count]) => ({
      name,
      count,
      pct: total ? (count / total) * 100 : 0
    }));
  };

  const rolesDist = countBy(ROLES, r => roleCategory(r.role)).filter(x => x.count > 0 || ROLES.slice(0, 6).includes(x.name));
  const stagesDist = countBy(STAGES, r => String(r.stage || '').trim());
  const expDist = countBy(EXPS, r => String(r.exp || '').trim());
  const genderDist = countBy(['ذكر', 'أنثى'], r => String(r.gender || '').trim());
  const partDist = countBy(['نعم', 'لا'], r => String(r.part || '').trim());

  // إحصاءات تفصيلية لأسئلة المحاور الخمسة (15 سؤالاً)
  const axesAnalysis = Q.map(([qId, maxPick, hasOther, qTitle, opts]) => {
    const counts = new Map(opts.map(o => [o, 0]));
    let otherCount = 0;
    let totalSelections = 0;
    v.forEach(r => {
      const raw = String(r[qId] || '').trim();
      if (!raw) return;
      raw.split(' | ').map(s => s.trim()).filter(Boolean).forEach(ans => {
        totalSelections++;
        if (counts.has(ans)) {
          counts.set(ans, counts.get(ans) + 1);
        } else {
          otherCount++;
        }
      });
    });
    const sortedOpts = [...counts.entries()]
      .map(([opt, cnt]) => ({
        opt,
        cnt,
        pctOfResp: total ? (cnt / total) * 100 : 0,
        pctOfVotes: totalSelections ? (cnt / totalSelections) * 100 : 0
      }))
      .sort((a, b) => b.cnt - a.cnt);

    return {
      qId,
      qNum: qn(qId),
      axisIdx: Number(qId[1]),
      axisName: AX[Number(qId[1]) - 1],
      qTitle: qTitle.replace(/\s*\(اختر.*?\)/, ''),
      maxPick,
      totalSelections,
      sortedOpts,
      otherCount
    };
  });

  return {
    total,
    domainStats,
    overallAvg,
    overallPct: (overallAvg / 5) * 100,
    hiDomain,
    loDomain,
    rolesDist,
    stagesDist,
    expDist,
    genderDist,
    partDist,
    axesAnalysis
  };
}

// رسم مخطط رادار SVG احترافي للمجالات الثمانية
function renderRadarChartSVG(domainStats) {
  const size = 320;
  const cx = size / 2;
  const cy = size / 2;
  const maxR = 105;
  const n = domainStats.length;

  const pt = (i, valOut5) => {
    const angle = (Math.PI * 2 * i) / n - Math.PI / 2;
    const r = (valOut5 / 5) * maxR;
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  };

  let gridPolys = '';
  for (let lvl = 1; lvl <= 5; lvl++) {
    const pts = domainStats.map((_, i) => pt(i, lvl).join(',')).join(' ');
    gridPolys += `<polygon points="${pts}" fill="none" stroke="#94a3b8" stroke-width="${lvl === 5 ? '1.5' : '0.7'}" stroke-dasharray="${lvl < 5 ? '3,3' : ''}"/>`;
  }

  let axesLines = '';
  let labelsSvg = '';
  domainStats.forEach((d, i) => {
    const [x, y] = pt(i, 5);
    axesLines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#cbd5e1" stroke-width="1"/>`;
    const [lx, ly] = pt(i, 6.15);
    labelsSvg += `
      <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="800" fill="currentColor">
        م${d.idx} (${d.a.toFixed(1)})
      </text>
    `;
  });

  const dataPts = domainStats.map((d, i) => pt(i, d.a || 0).join(',')).join(' ');
  const dotsSvg = domainStats.map((d, i) => {
    const [x, y] = pt(i, d.a || 0);
    return `<circle cx="${x}" cy="${y}" r="4.5" fill="#0b4f94" stroke="#fff" stroke-width="1.5"/>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:330px;height:auto;display:block;margin:0 auto">
      ${gridPolys}
      ${axesLines}
      <polygon points="${dataPts}" fill="rgba(11, 79, 148, 0.24)" stroke="#0b4f94" stroke-width="2.5"/>
      ${dotsSvg}
      ${labelsSvg}
    </svg>
  `;
}

// رسم مخطط دائري (Donut SVG) لتوزيع المراحل التعليمية
function renderDonutSVG(items, titleCenter) {
  const colors = ['#0b4f94', '#0b7a43', '#d97706', '#7c3aed', '#be1e2d', '#0891b2'];
  const total = items.reduce((s, x) => s + x.count, 0) || 1;
  let acc = 0;
  const r = 15.9155;
  const slices = items.map((item, idx) => {
    const pct = (item.count / total) * 100;
    const dash = `${pct} ${100 - pct}`;
    const offset = 25 - acc;
    acc += pct;
    return `<circle cx="21" cy="21" r="${r}" fill="transparent" stroke="${colors[idx % colors.length]}" stroke-width="5.5" stroke-dasharray="${dash}" stroke-dashoffset="${offset}"></circle>`;
  }).join('');

  const legend = items.map((item, idx) => `
    <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.78rem;padding:3px 0;border-bottom:1px dashed var(--bd)">
      <span><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${colors[idx % colors.length]};margin-left:6px"></i>${esc(item.name)}</span>
      <b>${item.count} (${Math.round(item.pct)}%)</b>
    </div>
  `).join('');

  return `
    <div style="display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center">
      <svg viewBox="0 0 42 42" style="width:125px;height:125px">
        <circle cx="21" cy="21" r="${r}" fill="transparent" stroke="#e2e8f0" stroke-width="5.5"></circle>
        ${slices}
        <text x="21" y="20" text-anchor="middle" font-size="6" font-weight="800" fill="currentColor">${total}</text>
        <text x="21" y="25.5" text-anchor="middle" font-size="3.3" font-weight="700" fill="currentColor">${esc(titleCenter)}</text>
      </svg>
      <div>${legend}</div>
    </div>
  `;
}

function renderOfficialPrintArea(v) {
  const area = $('#official-print-area');
  if (!area) return;
  if (!v.length) {
    area.innerHTML = `<p style="text-align:center;padding:30px">لا توجد بيانات لعرضها في الكشف.</p>`;
    return;
  }

  const st = computeAnalytics(v);
  if (activePrintSheet === 'all_summary') {
    area.innerHTML = buildSheetAnalytics(v, st);
  } else if (activePrintSheet === 'roster') {
    area.innerHTML = buildSheetRoster(v);
  } else if (activePrintSheet === 'axes') {
    area.innerHTML = buildSheetAxes(v, st);
  } else if (activePrintSheet === 'open') {
    area.innerHTML = buildSheetOpen(v);
  } else if (activePrintSheet === 'dossiers') {
    area.innerHTML = buildSheetDossiers(v);
  } else if (activePrintSheet === 'full_book') {
    area.innerHTML =
      buildSheetAnalytics(v, st) +
      `<div class="gov-page-break"></div>` +
      buildSheetAxes(v, st) +
      `<div class="gov-page-break"></div>` +
      buildSheetOpen(v) +
      `<div class="gov-page-break"></div>` +
      buildSheetRoster(v);
  }
}

/* =========================================================================
   تصدير ملف Excel (.xlsx) القياسي بدون مكتبات خارجية
   ========================================================================= */
const XLSX_TYPE = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

function xlsxColumn(number) {
  let letters = '';
  while (number > 0) {
    number--;
    letters = String.fromCharCode(65 + (number % 26)) + letters;
    number = Math.floor(number / 26);
  }
  return letters;
}

function xlsxText(value) {
  const text = String(value ?? '');
  if (text.length > 32767) throw new RangeError('يوجد رد يتجاوز الحد الأقصى لطول خلية Excel (32767 حرفاً).');
  return esc(
    text
      .replace(/[^\u0009\u000A\u000D\u0020-\uD7FF\uE000-\uFFFD\u{10000}-\u{10FFFF}]/gu, '\uFFFD')
      .replace(/_(?=x[0-9a-f]{4}_)/gi, '_x005F_')
  ).replace(/\r/g, '&#13;');
}

function xlsxZip(parts) {
  const encoder = new TextEncoder();
  const crcTable = new Uint32Array(256);
  for (let index = 0; index < crcTable.length; index++) {
    let crc = index;
    for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
    crcTable[index] = crc;
  }
  const files = [], directory = [];
  const entries = Object.entries(parts);
  let offset = 0, directorySize = 0;
  for (const [name, xml] of entries) {
    const fileName = encoder.encode(name);
    const data = encoder.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' + xml);
    let crc = 0xffffffff;
    for (const byte of data) crc = (crc >>> 8) ^ crcTable[(crc ^ byte) & 0xff];
    crc = (crc ^ 0xffffffff) >>> 0;
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(12, 33, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, data.length, true);
    local.setUint32(22, data.length, true);
    local.setUint16(26, fileName.length, true);
    files.push(local.buffer, fileName, data);
    const central = new DataView(new ArrayBuffer(46));
    central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    new Uint8Array(central.buffer, 6, 26).set(new Uint8Array(local.buffer, 4, 26));
    central.setUint32(42, offset, true);
    directory.push(central.buffer, fileName);
    offset += local.byteLength + fileName.length + data.length;
    directorySize += central.byteLength + fileName.length;
  }
  if (offset + directorySize + 22 > 0xffffffff) throw new RangeError('حجم الملف كبير. استخدم الفلاتر لتصدير الردود على دفعات.');
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true);
  end.setUint16(10, entries.length, true);
  end.setUint32(12, directorySize, true);
  end.setUint32(16, offset, true);
  return new Blob([...files, ...directory, end.buffer], { type: XLSX_TYPE });
}

function xlsxBlob(records) {
  if (records.length > 1048575) throw new RangeError('عدد الردود يتجاوز سعة ورقة Excel.');
  const columns = COLS.map((_, index) => xlsxColumn(index + 1));
  const rowXml = (record, number) => {
    const cells = COLS.map(([key, label], index) => {
      const value = number === 1 ? label : record[key] ?? '';
      if (value === '') return '';
      const ref = columns[index] + number;
      if (number > 1 && /^r[1-8]$/.test(key) && /^[1-5]$/.test(value)) {
        return `<c r="${ref}"><v>${value}</v></c>`;
      }
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xlsxText(value)}</t></is></c>`;
    }).join('');
    return `<row r="${number}">${cells}</row>`;
  };
  const ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const docRel = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const pkgRel = 'http://schemas.openxmlformats.org/package/2006/relationships';
  const content = 'application/vnd.openxmlformats-officedocument.spreadsheetml';
  const range = `A1:${columns[columns.length - 1]}${records.length + 1}`;
  return xlsxZip({
    '[Content_Types].xml': `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="${content}.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="${content}.worksheet+xml"/></Types>`,
    '_rels/.rels': `<Relationships xmlns="${pkgRel}"><Relationship Id="rId1" Type="${docRel}/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
    'xl/workbook.xml': `<workbook xmlns="${ns}" xmlns:r="${docRel}"><bookViews><workbookView/></bookViews><sheets><sheet name="ردود الاستبيان" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    'xl/_rels/workbook.xml.rels': `<Relationships xmlns="${pkgRel}"><Relationship Id="rId1" Type="${docRel}/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`,
    'xl/worksheets/sheet1.xml': `<worksheet xmlns="${ns}"><dimension ref="${range}"/><sheetViews><sheetView workbookViewId="0" rightToLeft="1"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultColWidth="24" defaultRowHeight="16"/><sheetData>${rowXml(null, 1)}${records.map((row, index) => rowXml(row, index + 2)).join('')}</sheetData><autoFilter ref="${range}"/></worksheet>`
  });
}

function xl() {
  try {
    const blob = xlsxBlob(flt());
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'suluq-survey-responses.xlsx';
    document.body.appendChild(link);
    try { link.click(); } finally {
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    toast('تم تجهيز وتحميل ملف Excel بنجاح');
  } catch (error) {
    showError(error instanceof RangeError ? error.message : 'تعذر إنشاء ملف Excel.');
  }
}

function route() {
  if (location.hash === '#admin') {
    admin();
    return;
  }
  rows = [];
  selectedDossier = null;
  render();
}

window.addEventListener('hashchange', route);
route();
