<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستبيان الوطني الموحد – مراقبة التربية والتعليم سلوق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.tg_t||(matchMedia('(prefers-color-scheme:dark)').matches?'d':'l');document.documentElement.dataset.t=t;document.documentElement.style.fontSize=(localStorage.tg_f||19)+'px'}catch(e){}</script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14233a;--mut:#52627a;--pr:#0b5cab;--pr2:#e5f0fb;--bd:#c9d6e6;--ok:#0a7a3d;--er:#c0262d}
:root[data-t=d]{--bg:#0e1522;--card:#17212f;--tx:#eef3fa;--mut:#a9b8cc;--pr:#5aa9f0;--pr2:#1d3350;--bd:#33445c;--ok:#4fd18b;--er:#ff7b80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.8}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:2px solid var(--bd);position:sticky;top:0;z-index:5}
header img{width:46px;height:46px;border-radius:50%}header h1{font-size:.8rem;margin:0;flex:1;line-height:1.4}
header button{width:42px;height:42px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:700 .9rem Cairo;cursor:pointer}
#bar{height:7px;background:var(--pr);width:0;transition:.3s}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.hero{text-align:center}.hero img{width:170px;height:170px;border-radius:50%;box-shadow:0 4px 18px #0003}
h2{font-size:1.15rem;color:var(--pr);margin:.2em 0 .6em}h3{font-size:1rem;margin:.8em 0 .3em}
.q{margin:18px 0}.q>b{display:block}
input[type=text],textarea,select{width:100%;font:inherit;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px}
.ch{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid var(--bd);border-radius:14px;margin:8px 0;cursor:pointer}
.ch input{width:24px;height:24px;margin-top:4px;flex:none;accent-color:var(--pr)}
.ch:has(input:checked){border-color:var(--pr);background:var(--pr2)}
.rt{display:flex;gap:6px;margin-top:6px}.rt label{flex:1}.rt input{display:none}
.rt span{display:block;text-align:center;padding:12px 0;border:2px solid var(--bd);border-radius:12px;font-weight:800;cursor:pointer}
.rt input:checked+span{background:var(--pr);color:#fff;border-color:var(--pr)}
.nav{display:flex;gap:10px;margin-top:16px}
.b,.b2{flex:1;font:800 1.05rem Cairo;padding:14px;border-radius:14px;border:2px solid var(--pr);cursor:pointer}
.b{background:var(--pr);color:#fff}.b2{background:none;color:var(--pr)}
.b:disabled{opacity:.5}
.mut{color:var(--mut);font-size:.85rem}.er{color:var(--er);font-weight:700;min-height:1.5em}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9}
.tw{overflow:auto;max-height:70vh;border:2px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.7rem}
th,td{border:1px solid var(--bd);padding:5px 7px;vertical-align:top;min-width:90px}
th{background:var(--pr2);position:sticky;top:0}.fl{width:100%;font:inherit;padding:4px;min-width:80px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.bar2 .b,.bar2 .b2{flex:1 1 140px;padding:10px;font-size:.85rem}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kp div{background:var(--pr2);border-radius:12px;padding:8px;text-align:center;font-size:.75rem;line-height:1.5}
.kp b{display:block;font-size:1.3rem;color:var(--pr)}
.cr{margin:12px 0}.cr>span{display:block;font-size:.78rem;line-height:1.5;margin-bottom:3px}
.tr{display:flex;align-items:center;gap:8px}
.tk{flex:1;height:20px;background:var(--pr2);border-radius:10px;overflow:hidden;display:flex}
.tk i{display:block;height:100%;font:700 .65rem/20px Cairo;text-align:center;font-style:normal;color:#fff;overflow:hidden;transition:width .4s}
.vl{width:2.6em;font-weight:800;font-size:.8rem;text-align:center}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;margin:6px 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-inline-end:4px}
#ph,#cards{display:none}
@media(min-width:760px){html{font-size:20px}}
@media print{
 :root{--bg:#fff;--card:#fff;--tx:#000;--bd:#999;--pr2:#e8eef6}
 body{background:#fff;color:#000}header,.bar2,.fl,#login,#bar,.noprint{display:none!important}
 #ph{display:block;text-align:center;border-bottom:3px double #000;margin-bottom:8px}#ph img{width:80px}
 .tw{max-height:none;overflow:visible;border:0}table{font-size:9pt}th,td{min-width:0}
 body[data-pm=t] .x{display:none}body[data-pm=c] .tw{display:none}
 body[data-pm=c] #cards{display:block}.c2{break-inside:avoid;border:1px solid #000;padding:6px;margin:6px 0;font-size:9pt}
 .c2 h3{margin:0 0 4px}.c2 p{margin:1px 0}@page{size:A4 landscape;margin:10mm}}
</style></head><body>

['q11',3,1,'ما هي أهم (3) أهداف استراتيجية يجب أن ترتكز عليها السياسة التعليمية الوطنية في ليبيا؟ (اختر 3 فقط)',['بناء الهوية الوطنية والانتماء والقيم الأخلاقية','تنمية مهارات التفكير النقدي، وحل المشكلات، والابتكار','المواءمة الوثيقة مع احتياجات الاقتصاد وسوق العمل الحديث','تحقيق العدالة الاجتماعية وتكافؤ الفرص التعليمية بين كافة المناطق','ترسيخ ثقافة التعلم المستمر مدى الحياة ومواكبة الثورة المعرفية']],
